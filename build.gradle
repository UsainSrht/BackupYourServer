plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.5.0'
}

group = 'me.usainsrht'
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.61-beta'
    compileOnly 'io.github.miniplaceholders:miniplaceholders-api:3.2.0'

    implementation 'org.bstats:bstats-bukkit:3.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.61-beta'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def props = [
            'version': project.version
    ]
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.bstats', 'me.usainsrht.backupyourserver.libs.bstats'
}

build.dependsOn shadowJar

tasks.named('jar') {
    enabled = false
}
